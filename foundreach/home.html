<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoundReach</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("file:///usr/share/fonts/truetype/inter/Inter.ttf") format("truetype");
    font-weight: 100 900; font-display: swap;
  }
  :root {
    --bg: #f5f3ee;         /* soft warm off-white — coherent, no yellow */
    --ink: #1b1b1a;
    --muted: #7c776e;
    --line: rgba(27,27,26,0.12);
    --card: #ffffff;
    --accent: #1b1b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e0d; --ink:#f2f0ea; --muted:#9a958b; --line:rgba(255,255,255,0.12); --card:#171716; --accent:#f2f0ea; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: 24px; -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mark::after { content: ""; width: 12px; height: 12px; border-radius: 50%;
    border: 2.5px solid var(--bg); }
  .wordmark { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .tag { color: var(--muted); font-size: 14.5px; margin-top: -22px; letter-spacing: 0.01em; }
  form { width: min(560px, 92vw); position: relative; }
  input[type="search"] {
    width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; font-size: 16px;
    padding: 0 52px 0 20px; outline: none;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 12px 30px rgba(0,0,0,0.04);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="search"]::placeholder { color: var(--muted); }
  input[type="search"]:focus { border-color: rgba(27,27,26,0.35);
    box-shadow: 0 0 0 4px rgba(27,27,26,0.06), 0 12px 30px rgba(0,0,0,0.06); }
  button.go {
    position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 0;
    border-radius: 12px; background: var(--accent); color: var(--bg); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .links a {
    text-decoration: none; color: var(--ink); font-size: 13.5px; font-weight: 500;
    padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); transition: border-color .15s, transform .1s;
  }
  .links a:hover { border-color: rgba(27,27,26,0.32); transform: translateY(-1px); }
  .foot { position: fixed; bottom: 18px; color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark"></span>
    <span class="wordmark">FoundReach</span>
  </div>
  <div class="tag">Your autonomous acquisition workspace</div>

  <form action="https://www.google.com/search" method="get">
    <input type="search" name="q" placeholder="Search the web…" autofocus autocomplete="off" spellcheck="false">
    <button class="go" type="submit" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <nav class="links">
    <a href="https://foundreach-app.vercel.app">Workspace</a>
    <a href="https://mail.google.com">Mail</a>
    <a href="https://calendar.google.com">Calendar</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://www.linkedin.com">LinkedIn</a>
  </nav>

  <div class="foot">FoundReach</div>
</body>
</html>
