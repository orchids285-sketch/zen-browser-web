// FoundReach browser autoconfig — runs privileged at every startup.
// The first line MUST be a comment (Firefox ignores it). We override the
// new-tab URL so EVERY new tab (and the tab Zen opens on startup) shows our
// FoundReach home page instead of Zen's default new tab.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file:///opt/foundreach/home.html";
} catch (e) {
  try { Components.utils.reportError(e); } catch (_) {}
}
defaultPref("browser.startup.homepage", "file:///opt/foundreach/home.html");
defaultPref("browser.startup.page", 1);
